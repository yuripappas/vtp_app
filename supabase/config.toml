# Config por-function do Supabase CLI. As outras 14 Edge Functions do projeto
# não têm entrada aqui (não precisavam até agora — foram deployadas com o
# verify_jwt padrão ou via flag manual na hora do deploy).
#
# mcp-relatorios faz sua PRÓPRIA autenticação (token MCP_ACCESS_TOKEN
# verificado no header Authorization, dentro do código da function —
# ver index.ts) porque o cliente MCP (Hermes) manda um token de app, não
# um JWT do Supabase. Sem "verify_jwt = false" aqui, o gateway do Supabase
# rejeita a requisição ANTES dela chegar no código da function (erro
# "UNAUTHORIZED_INVALID_JWT_FORMAT"), porque por padrão ele espera um JWT
# válido (anon key ou de usuário) nesse mesmo header.
[functions.mcp-relatorios]
verify_jwt = false

# ig-token-refresh é chamada só pelo pg_cron (ver migration
# 20261006120100_ig_token_refresh_cron.sql), que não manda um JWT do Supabase
# no Authorization — manda um segredo próprio no header x-cron-secret,
# conferido dentro do código da function contra a tabela atd_cron_tokens.
[functions.ig-token-refresh]
verify_jwt = false
